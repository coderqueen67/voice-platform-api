services:
  postgres:
    image: postgres:16-alpine
    container_name: voice-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voice_user
      POSTGRES_PASSWORD: voice_password
      POSTGRES_DB: voice_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_user -d voice_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: voice-platform-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
